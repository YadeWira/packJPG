name: CI

on:
  push:
    branches: [ master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilers
        run: sudo apt-get update -q && sudo apt-get install -y mingw-w64

      - name: Build all targets
        run: bash build_all.sh

      - name: Smoke test (Linux binary)
        run: |
          find test-files -name '*.jpg' ! -name '* *' | head -5 | while read f; do
            stem=$(basename "${f%.*}")
            ./dist/packJPG_linux_x64 a -np -o -od/tmp "$f"
            ./dist/packJPG_linux_x64 x -np -o -od/tmp "/tmp/${stem}.pjg"
            cmp "$f" "/tmp/${stem}.jpg" && echo "PASS: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
