name: CI

on:
  push:
    # '6.0' entre comillas: sin ellas YAML lo lee como el numero 6.0 y la rama
    # nunca matchea. La linea de trabajo de la 6.0 tiene que pasar por CI --y
    # sobre todo por el job ARM64 de cross-platform, que es el unico host no
    # x86_64 y el que encontro el bug de `padbit`-- antes de tocar master.
    branches: [ master, '6.0' ]
    tags:     [ '[0-9]*', 'v[0-9]*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.0a)'
        required: true

jobs:
  build:
    name: Build & test
    # Pinned (not ubuntu-latest): the build machine's glibc/libstdc++ version
    # gets baked into the released binaries as a minimum-version runtime
    # requirement. ubuntu-latest silently rolled to 24.04 (glibc 2.39) at some
    # point, so packJPG_linux_x64/libpackJPG.so/the .deb required GLIBC_2.38
    # (__isoc23_sscanf, fmod) and couldn't even start on Ubuntu 22.04 LTS or
    # Debian 12 — same failure class as the libjxl0.7-vs-0.11 .deb bug, just
    # for glibc instead. ubuntu-22.04 (glibc 2.35) gives a much wider floor.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # libcharls-dev/libjxl-dev no longer needed: JPEG-LS is fully covered
        # by the vendored static libs under source/linuxlibs/ (see its
        # README.md) — the Makefile prefers those over any system libcharls/
        # libjxl. Dropping them also fixes ubuntu-22.04 CI, which doesn't
        # even have a libjxl-dev package in its default repos.
        run: sudo apt-get update -q && sudo apt-get install -y mingw-w64 rpm

      - name: Build all targets
        run: bash build_all.sh

      - name: Build packages (.tar.gz, .deb, .rpm)
        run: bash build_pkg.sh --tar --deb --rpm

      - name: Build library/SDK archives (linux/win64/win32)
        run: bash build_lib_pkg.sh

      - name: Smoke test (Linux binary)
        run: |
          find test-files -name '*.jpg' ! -name '* *' | head -5 | while read f; do
            stem=$(basename "${f%.*}")
            ./dist/packJPG_linux_x64 a --no-pause -f --output-dir=/tmp "$f"
            ./dist/packJPG_linux_x64 x --no-pause -f --output-dir=/tmp "/tmp/${stem}.pjg"
            cmp "$f" "/tmp/${stem}.jpg" && echo "PASS: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Smoke test (JPEG-LS, Linux binary)
        run: |
          f=test-files/grayscale.jls
          ./dist/packJPG_linux_x64 a --no-pause -f --output-dir=/tmp "$f"
          ./dist/packJPG_linux_x64 x --no-pause -f --output-dir=/tmp /tmp/grayscale.pjg
          cmp "$f" /tmp/grayscale.jls && echo "PASS: $f (JPEG-LS)" || { echo "FAIL: $f (JPEG-LS)"; exit 1; }

      - name: Lib batch API smoke (v4.0e)
        run: |
          ( cd source && \
            make lib CXX=c++ CXXFLAGS="-I. -O2 -Wall -DUNIX -DBUILD_LIB -std=c++17" -j$(nproc) && \
            c++ -I. -O2 -std=c++17 test/lib_batch_test.cpp packJPGlib.a -lpthread -o test/lib_batch_test && \
            ./test/lib_batch_test ../test-files/*.jpg )

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/
          if-no-files-found: error

  # El contenedor PJA no tenia NINGUNA cobertura de CI: sus 43 pruebas de Rust y
  # las celdas de frontera en C++ corrian solo a mano. Un job aparte del build
  # porque necesita toolchain de Rust, que `make all` deliberadamente no pide.
  pja:
    name: PJA container (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          gcc --version | head -1

      - name: Corpus for the Rust tests
        working-directory: source
        run: |
          # Las pruebas necesitan .pjg reales. Se generan con el packJPG DE ESTE
          # COMMIT, no con un fixture congelado, asi prueban contra lo que este
          # arbol produce. El target falla si quedan menos de 10.
          make -j$(nproc)
          make pja-corpus

      - name: Rust test suite
        run: |
          # `cargo test` compila contra std; el Makefile construye el staticlib
          # no_std. Son dos builds distintos a proposito y los dos tienen que
          # andar, asi que el job corre los dos.
          out=$(cargo test --release --manifest-path source/pja/Cargo.toml 2>&1)
          echo "$out"
          # Contar las pruebas y no solo mirar el rc: un filtro mal puesto o un
          # modulo que deja de compilarse en modo test da "ok. 0 passed", que es
          # verde y no probo nada.
          n=$(echo "$out" | grep -oE '^test result: ok\. [0-9]+ passed' | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "pruebas de Rust que pasaron: ${n:-0}"
          if [ "${n:-0}" -lt 40 ]; then
            echo "FAIL: esperaba al menos 40 pruebas, corrieron ${n:-0}"; exit 1
          fi

      - name: Build (make pja / pja-tests)
        working-directory: source
        run: |
          make pja
          make pja-tests

      - name: FFI boundary, plain and encrypted
        working-directory: source
        run: |
          # La frontera necesita contenedores de verdad; gen los arma con .pjg
          # reales producidos por el propio packJPG.
          make -j$(nproc)
          mkdir -p /tmp/pjaci && cp ../test-files/*.jpg /tmp/pjaci/ 2>/dev/null || true
          ls /tmp/pjaci/*.jpg >/dev/null || { echo "FAIL: no hay jpgs de prueba"; exit 1; }
          ./packJPG a --no-pause -f /tmp/pjaci/*.jpg
          set -- $(ls /tmp/pjaci/*.pjg | head -3)
          [ $# -eq 3 ] || { echo "FAIL: esperaba 3 .pjg, hay $#"; exit 1; }
          ./pja/target/release/gen /tmp/claro.pja  -          "$1" "$2" "$3"
          ./pja/target/release/gen /tmp/cif.pja    clave-ci   "$1" "$2" "$3"
          # Los dos casos explicitos, no un lazo sobre una cadena con espacios:
          # que "archivo clave" se parta en dos argumentos depende del shell, y
          # donde no se parte el binario no encuentra el archivo y reporta CERO
          # celdas con rc distinto de cero. Escribirlos derecho no tiene ese modo.
          frontera() {
            out=$("$@")
            echo "$out"
            celdas=$(echo "$out" | grep -c ' ok$')
            echo "  celdas en verde: $celdas"
            # El rc solo dice "hubo fallos". Que las celdas se hayan EJECUTADO es
            # otra cosa: un binario que sale temprano puede dar cero celdas.
            [ "$celdas" -ge 10 ] || { echo "FAIL: solo $celdas celdas, esperaba >=10"; return 1; }
          }
          frontera ./pja/test_frontera /tmp/claro.pja
          frontera ./pja/test_frontera /tmp/cif.pja clave-ci

      - name: Header of an encrypted container leaks nothing
        working-directory: source
        run: |
          # tam_indice y hash_indice tienen que estar en cero en disco. Si no,
          # el archivo confirma los nombres de adentro sin contrasena.
          # -s 8 -l 20: exactamente tam_indice(4) + hash_indice(16). -c 20 evita
          # que xxd corte la linea, que fue como se me colo la primera version:
          # devolvia cadena VACIA y "esta todo en cero" daba verde. Lo agarro el
          # control de abajo, no el chequeo.
          claro=$(xxd -p -c 20 -s 8 -l 20 /tmp/claro.pja)
          cif=$(xxd   -p -c 20 -s 8 -l 20 /tmp/cif.pja)
          echo "sin cifrar: ${claro:-(vacio)}"
          echo "cifrado   : ${cif:-(vacio)}"
          [ -n "$cif" ] && [ -n "$claro" ] || { echo "FAIL: no pude leer las cabeceras"; exit 1; }
          case "$cif" in *[!0]*) echo "FAIL: la cabecera cifrada trae datos"; exit 1 ;; esac
          # Control positivo: sin cifrar esos mismos bytes TIENEN que traer
          # datos. Sin esta mitad, cualquier forma de leer nada pasa el test.
          case "$claro" in *[!0]*) : ;; *) echo "FAIL: control - sin cifrar tendria que traer datos"; exit 1 ;; esac
          echo "OK: cifrado en cero, y el control sin cifrar no lo esta"

      - name: Container round-trip (pjatool)
        working-directory: source
        run: |
          rm -rf /tmp/rt_ent /tmp/rt_sal && mkdir -p /tmp/rt_ent /tmp/rt_sal
          cp ../test-files/*.jpg /tmp/rt_ent/
          ./pja/pjatool crear /tmp/rt.pjg /tmp/rt_ent/*.jpg
          ./pja/pjatool extraer /tmp/rt.pjg /tmp/rt_sal
          total=0; ok=0
          for f in /tmp/rt_ent/*.jpg; do
            total=$((total+1))
            cmp -s "$f" "/tmp/rt_sal/$(basename $f)" && ok=$((ok+1)) || echo "FAIL: $(basename $f)"
          done
          echo "round-trip del contenedor: $ok/$total identicos"
          [ "$total" -gt 0 ] || { echo "FAIL: no habia entradas"; exit 1; }
          [ "$ok" -eq "$total" ] || exit 1

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          NOTES="$(awk "/^## v${VERSION//./\\.}/,/^---/" CHANGELOG.md | sed '$d')"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"
          echo "tag=$REF"  >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: "${{ steps.changelog.outputs.tag }} Windows & Linux"
          files: dist/*
          body: ${{ steps.changelog.outputs.notes }}

  apt-repo:
    name: Update apt repository
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download .deb from artifacts
        uses: actions/download-artifact@v4
        with:
          name: packJPG-binaries
          path: /tmp/dist

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase "" --import
          echo "${{ secrets.GPG_KEY_ID }}:6:" | gpg --import-ownertrust

      - name: Update apt repository
        run: |
          sudo apt-get install -y apt-utils

          cp /tmp/dist/*.deb pool/main/

          dpkg-scanpackages --multiversion pool/ \
            > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          printf '%s\n' \
            'Origin: packJPG' \
            'Label: packJPG' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: amd64' \
            'Components: main' \
            'Description: packJPG apt repository' \
            > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "apt: publish packjpg ${{ github.event.inputs.tag || github.ref_name }}"
          git push

      - name: Notify shared pack-apt repo
        # Feeds the same .deb into the Pack Family shared apt repo
        # (github.com/YadeWira/pack-apt) alongside packJPG's own gh-pages
        # above. PACK_APT_TOKEN is a fine-grained PAT (Contents: read/write,
        # scoped only to pack-apt) — GITHUB_TOKEN can't dispatch across repos.
        env:
          GH_TOKEN: ${{ secrets.PACK_APT_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh api repos/YadeWira/pack-apt/dispatches \
            -f event_type=deb-release \
            -f "client_payload[repo]=YadeWira/packJPG" \
            -f "client_payload[tag]=$TAG"
