name: CI

on:
  push:
    # '6.0' entre comillas: sin ellas YAML lo lee como el numero 6.0 y la rama
    # nunca matchea. La linea de trabajo de la 6.0 tiene que pasar por CI --y
    # sobre todo por el job ARM64 de cross-platform, que es el unico host no
    # x86_64 y el que encontro el bug de `padbit`-- antes de tocar master.
    branches: [ master, '6.0' ]
    tags:     [ '[0-9]*', 'v[0-9]*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.0a)'
        required: true

jobs:
  build:
    name: Build & test
    # Pinned (not ubuntu-latest): the build machine's glibc/libstdc++ version
    # gets baked into the released binaries as a minimum-version runtime
    # requirement. ubuntu-latest silently rolled to 24.04 (glibc 2.39) at some
    # point, so packJPG_linux_x64/libpackJPG.so/the .deb required GLIBC_2.38
    # (__isoc23_sscanf, fmod) and couldn't even start on Ubuntu 22.04 LTS or
    # Debian 12 — same failure class as the libjxl0.7-vs-0.11 .deb bug, just
    # for glibc instead. ubuntu-22.04 (glibc 2.35) gives a much wider floor.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # libcharls-dev/libjxl-dev no longer needed: JPEG-LS is fully covered
        # by the vendored static libs under source/linuxlibs/ (see its
        # README.md) — the Makefile prefers those over any system libcharls/
        # libjxl. Dropping them also fixes ubuntu-22.04 CI, which doesn't
        # even have a libjxl-dev package in its default repos.
        # fpc: since 6.0 'a' writes .pja, whose core is FreePascal. fpc-source
        # and the win64 units are for the Windows DLLs; the i386-win32 cross
        # compiler is built from fpc-source by pja/pas/fpc_i386_win32.sh.
        run: sudo apt-get update -q && sudo apt-get install -y mingw-w64 rpm fpc fpc-source-3.2.2 fp-units-win-rtl-3.2.2

      - name: Build all targets
        run: bash build_all.sh

      - name: Build packages (.tar.gz, .deb, .rpm)
        run: bash build_pkg.sh --tar --deb --rpm

      - name: Build library/SDK archives (linux/win64/win32)
        run: bash build_lib_pkg.sh

      - name: Smoke test (Linux binary)
        run: |
          find test-files -name '*.jpg' ! -name '* *' | head -5 | while read f; do
            stem=$(basename "${f%.*}")
            ./dist/packJPG_linux_x64 a --no-pause -f --output-dir=/tmp "$f"
            ./dist/packJPG_linux_x64 x --no-pause -f --output-dir=/tmp "/tmp/${stem}.pja"
            cmp "$f" "/tmp/${stem}.jpg" && echo "PASS: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Smoke test (JPEG-LS, Linux binary)
        run: |
          f=test-files/grayscale.jls
          ./dist/packJPG_linux_x64 a --no-pause -f --output-dir=/tmp "$f"
          ./dist/packJPG_linux_x64 x --no-pause -f --output-dir=/tmp /tmp/grayscale.pja
          cmp "$f" /tmp/grayscale.jls && echo "PASS: $f (JPEG-LS)" || { echo "FAIL: $f (JPEG-LS)"; exit 1; }

      - name: The .pja from the CLI (Linux release binary)
        run: |
          # passwords from every source, tampered files, -f, links, threads,
          # pipes; each cell says what it expects, and fewer cells than
          # planned is a failure
          bash source/test/cli_pja.sh "$PWD/dist/packJPG_linux_x64" "$PWD/test-files"

      - name: Windows binaries ship with their .pja DLL
        run: |
          for a in x64 x86; do
            test -f dist/pjaffi_$a.dll || { echo "FAIL: falta dist/pjaffi_$a.dll"; exit 1; }
          done
          x86_64-w64-mingw32-objdump -p dist/packJPG_win_x64.exe | grep -q 'pjaffi_x64.dll' || { echo "FAIL: x64 no importa pjaffi_x64.dll"; exit 1; }
          i686-w64-mingw32-objdump   -p dist/packJPG_win_x86.exe | grep -q 'pjaffi_x86.dll' || { echo "FAIL: x86 no importa pjaffi_x86.dll"; exit 1; }
          echo "OK: cada .exe importa la DLL de su arquitectura, y las dos estan en dist/"

      - name: Lib batch API smoke (v4.0e)
        run: |
          ( cd source && \
            make lib CXX=c++ CXXFLAGS="-I. -O2 -Wall -DUNIX -DBUILD_LIB -std=c++17" -j$(nproc) && \
            c++ -I. -O2 -std=c++17 test/lib_batch_test.cpp packJPGlib.a -lpthread -o test/lib_batch_test && \
            ./test/lib_batch_test ../test-files/*.jpg )

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/
          if-no-files-found: error

  # El formato .pja: nucleo en FreePascal (+ cripto en C) detras de pjacore.h.
  # Job aparte del build porque necesita FreePascal, que `make all`
  # deliberadamente no pide.
  pja:
    name: PJA format (FreePascal)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # sin update el indice del runner puede estar viejo y el espejo da 404
          sudo apt-get update -qq
          sudo apt-get install -y -qq fpc > /dev/null
          fpc -iV
          gcc --version | head -1

      - name: Suite (make pja-check)
        working-directory: source
        run: |
          # Guardias de fuente, pruebas Pascal contra los vectores congelados
          # (pruebas/kat.txt), la frontera C con 8 hilos, ida y vuelta con el
          # codec (sin cifrar y cifrado), y bits al azar sobre un .pja: ninguno
          # puede terminar en un JPEG distinto entregado como bueno. Cada prueba
          # exige su cuenta minima de celdas: una que corre cero no pasa.
          make -j$(nproc)
          out=$(make pja-check 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -vE '^(g\+\+|gcc|ar|ranlib) '
          # El rc solo dice "no hubo fallos". Que las partes hayan CORRIDO es
          # otra cosa: se exige ver cada una.
          n=$(echo "$out" | grep -cE '^[0-9]+ celdas, 0 fallas$' || true)
          [ "$n" -ge 5 ] || { echo "FAIL: $n pruebas Pascal en verde, esperaba 5"; exit 1; }
          # -F: texto literal. Con -E, '(0 fallos)' es un grupo y nunca coincide.
          for marca in 'todo en verde (0 fallos)' 'ida y vuelta pjatool: 5 de 5' \
                       '+ 0 descriptor distinto + 0 payload distinto + 0 iguales' 'sin pja_iniciar: 0 malas'; do
            echo "$out" | grep -qF "$marca" || { echo "FAIL: no aparece '$marca'"; exit 1; }
          done
          echo "$out" | grep -qE 'JPEG distinto entregado como bueno +0$' || { echo "FAIL: corrupcion punta a punta"; exit 1; }
          echo "$out" | grep -qx 'todo en verde' || { echo "FAIL: la suite no llego al final"; exit 1; }

      - name: Build the C++ consumers (make pja-tests)
        working-directory: source
        run: make pja-tests

  # .pjg con un bit alterado que rompian el decodificador (puntero nulo y
  # lecturas fuera del heap). Una lectura fuera de rango no hace caer un build
  # normal: solo se ve con los sanitizers, asi que este job compila con ellos.
  codec-asan:
    name: Codec under ASan/UBSan (corrupt .pjg regressions)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Corrupt .pjg are rejected cleanly
        working-directory: source
        run: test/pjg_corruptos.sh

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: packJPG-binaries
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          NOTES="$(awk "/^## v${VERSION//./\\.}/,/^---/" CHANGELOG.md | sed '$d')"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"
          echo "tag=$REF"  >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: "${{ steps.changelog.outputs.tag }} Windows & Linux"
          files: dist/*
          body: ${{ steps.changelog.outputs.notes }}

  apt-repo:
    name: Update apt repository
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download .deb from artifacts
        uses: actions/download-artifact@v4
        with:
          name: packJPG-binaries
          path: /tmp/dist

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase "" --import
          echo "${{ secrets.GPG_KEY_ID }}:6:" | gpg --import-ownertrust

      - name: Update apt repository
        run: |
          sudo apt-get install -y apt-utils

          cp /tmp/dist/*.deb pool/main/

          dpkg-scanpackages --multiversion pool/ \
            > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          printf '%s\n' \
            'Origin: packJPG' \
            'Label: packJPG' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: amd64' \
            'Components: main' \
            'Description: packJPG apt repository' \
            > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "apt: publish packjpg ${{ github.event.inputs.tag || github.ref_name }}"
          git push

      - name: Notify shared pack-apt repo
        # Feeds the same .deb into the Pack Family shared apt repo
        # (github.com/YadeWira/pack-apt) alongside packJPG's own gh-pages
        # above. PACK_APT_TOKEN is a fine-grained PAT (Contents: read/write,
        # scoped only to pack-apt) — GITHUB_TOKEN can't dispatch across repos.
        env:
          GH_TOKEN: ${{ secrets.PACK_APT_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh api repos/YadeWira/pack-apt/dispatches \
            -f event_type=deb-release \
            -f "client_payload[repo]=YadeWira/packJPG" \
            -f "client_payload[tag]=$TAG"
